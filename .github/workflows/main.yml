name: Build MusicBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier Java
        run: java -version

      - name: Vérifier le projet
        run: test -f www/index.html

      - name: Ajouter Android
        run: npx cap add android

      - name: Construire l'application Web
        run: npm run build

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Donner les permissions Gradle
        run: chmod +x android/gradlew

      - name: Compiler l'APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicBox-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
