<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#00e5ff">
<title>MusicBox</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#0b1220;--muted:#5d6b82;--line:#d5deea;--accent:#00a6c0;--accent2:#0070d6;--onaccent:#fff;--danger:#d92d4f;--shadow:0 10px 30px rgba(10,30,60,.08)}
:root[data-theme=dark]{--bg:#07080d;--card:#0e1119;--ink:#e8f1ff;--muted:#7f8aa3;--line:#1d2536;--onaccent:#00131a;--danger:#ff3b5c;--shadow:0 12px 35px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:92px;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
button.danger{color:var(--danger)}
button.icon{width:44px;height:44px;padding:0;display:grid;place-items:center}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
main{width:min(720px,100%);margin:auto;padding:18px 16px 24px}
h1{font-size:30px;margin:0 0 7px;letter-spacing:-.6px}
h2{font-size:20px;margin:25px 0 12px}
p{color:var(--muted);margin:6px 0 14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top .grow{flex:1}
.brand{font-weight:900;font-size:22px}.brand span{color:var(--accent)}
.search{position:relative;margin:10px 0 16px}.search input{padding-left:44px}
.search b{position:absolute;left:15px;top:11px;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin:10px 0 18px}
.hero h2{margin:0 0 6px;font-size:25px}.hero p{color:#fff;opacity:.88}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:rgba(255,255,255,.14);border-radius:15px;padding:11px}.stat b{display:block;font-size:19px}.stat small{opacity:.78}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:13px}
.cover{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--accent),#222);color:#fff;font-weight:900;font-size:20px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}
.song{padding:9px 0}.song+.song{border-top:1px solid var(--line)}.song .cover{width:50px;height:50px;border-radius:13px}
.song .actions{display:flex;gap:5px}.song .actions button{border:0;background:transparent;padding:7px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}.chips button{white-space:nowrap}.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:35px 10px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom))}
.bottom .nav{display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:auto}.bottom button{border:0;background:transparent;padding:8px 3px;border-radius:13px;color:var(--muted);font-size:12px}.bottom button.active{color:var(--accent);font-weight:800;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.player{position:fixed;left:8px;right:8px;bottom:76px;z-index:25;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 10px;box-shadow:var(--shadow);display:none}.player.show{display:block}.player .mini{display:flex;align-items:center;gap:9px}.player .cover{width:44px;height:44px;border-radius:11px}.player .grow{overflow:hidden}.player button{border:0;background:transparent;padding:8px}.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:7px 0 2px}.progress i{display:block;height:100%;width:0;background:var(--accent)}
.fullplayer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));overflow:auto}.fullplayer.show{display:block}.full-cover{width:min(76vw,330px);aspect-ratio:1;margin:42px auto 25px;border-radius:28px;background:linear-gradient(135deg,var(--accent),#1b1b22);display:grid;place-items:center;color:#fff;font-size:70px;font-weight:900;overflow:hidden;box-shadow:var(--shadow)}.full-cover img{width:100%;height:100%;object-fit:cover}.bigcontrols{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0}.bigcontrols button{border:0;background:transparent;font-size:25px}.bigcontrols .playbtn{width:68px;height:68px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px}
.bigcontrols .modebtn{
  position:relative;width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;font-size:22px;
  border:1px solid transparent;background:transparent;color:var(--muted);
  transition:.18s ease;
}
.bigcontrols .modebtn.active{
  color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-color:color-mix(in srgb,var(--accent) 24%,transparent);
}
.bigcontrols .modebtn.off{opacity:.72}
.bigcontrols .modebtn .slash{
  position:absolute;left:10px;right:10px;top:23px;height:2px;
  background:currentColor;transform:rotate(-45deg);border-radius:2px;
  pointer-events:none;
}
.bigcontrols .modebtn .dot{
  position:absolute;right:7px;bottom:6px;width:7px;height:7px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card);
}
.bigcontrols .modebtn .one{
  position:absolute;right:5px;bottom:4px;min-width:16px;height:16px;
  padding:0 3px;border-radius:8px;background:var(--accent);color:#fff;
  font:bold 10px/16px system-ui;text-align:center;box-shadow:0 0 0 2px var(--card);
}
.bigcontrols .playbtn{box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 35%,transparent)}

.range{width:100%;accent-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);display:none;align-items:flex-end;padding:10px}.modal.show{display:flex}.sheet{background:var(--card);width:min(720px,100%);margin:auto;border-radius:24px;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.closex{float:right}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
.colorrow{display:flex;gap:9px;flex-wrap:wrap}.color{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);outline:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:100;background:#151622;color:#fff;padding:11px 15px;border-radius:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}.hero{padding:17px}.grid2{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:9px 7px}}
/* ===== Thème techno dark ===== */
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
html,body{background-color:var(--bg);background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px),radial-gradient(900px 420px at 85% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(700px 400px at -10% 110%,rgba(255,43,214,.09),transparent 70%);background-size:32px 32px,32px 32px,auto,auto;background-attachment:fixed}
h1,h2,.brand,label,.title,.stat b,.bottom button,.toast,button.primary,.muted,.stat small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
h1{font-size:24px;text-transform:uppercase;letter-spacing:2.5px;text-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
h1::before{content:"> ";color:var(--accent)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent),transparent)}
.hero h2,.sheet h2,.fullplayer h2{display:block}.hero h2::after,.sheet h2::after,.fullplayer h2::after{display:none}
.brand{font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:18px}.brand span{color:var(--accent);text-shadow:0 0 14px var(--accent)}
.muted,p{font-size:12.5px}
button{border-radius:6px;background:color-mix(in srgb,var(--card) 92%,var(--accent));transition:border-color .15s,box-shadow .15s,transform .1s}
button:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 22%,transparent)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);border-color:transparent;text-transform:uppercase;letter-spacing:1.2px;font-size:13px;box-shadow:0 0 20px color-mix(in srgb,var(--accent) 40%,transparent)}
button.danger{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
input,select{border-radius:6px;background:color-mix(in srgb,var(--bg) 70%,var(--card))}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search b{color:var(--accent)}
label{text-transform:uppercase;letter-spacing:1.4px;font-size:11.5px;color:var(--muted)}
.card{border-radius:10px;border-color:var(--line);border-left:2px solid color-mix(in srgb,var(--accent) 70%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--card) 94%,var(--accent)),var(--card));box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hero{border-radius:12px;background:linear-gradient(135deg,#06222c 0%,#0a0f1c 55%,#220a2e 100%);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 34px color-mix(in srgb,var(--accent) 18%,transparent),inset 0 0 40px rgba(0,229,255,.04);color:#e8f1ff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.hero h2{font-size:21px;color:#fff;letter-spacing:2px;text-shadow:0 0 16px var(--accent)}
.hero p{color:#9fb7d6;opacity:1}
.stat{border-radius:6px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.22)}
.stat b{color:var(--accent);text-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.stat small{color:#8aa3c4;opacity:1;text-transform:uppercase;letter-spacing:1px;font-size:10px}
.hero>button{background:var(--accent)!important;color:var(--onaccent)!important;border-radius:6px!important;text-transform:uppercase;letter-spacing:1.2px;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.cover{border-radius:8px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#000),#1a0b2e);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 18%,transparent)}
.song{padding:10px 4px;border-radius:8px}.song+.song{border-top:1px dashed var(--line)}.song .actions button{background:transparent;box-shadow:none}
.title{letter-spacing:.3px;font-weight:700;font-size:14px}
.chips button{border-radius:999px;font-size:12px;text-transform:uppercase;letter-spacing:1px}.chips button.on{color:var(--onaccent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.empty{border:1px dashed color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:12px}
.bottom{background:color-mix(in srgb,var(--bg) 88%,transparent);border-top:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 -6px 30px color-mix(in srgb,var(--accent) 10%,transparent)}
.bottom button{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;border-radius:6px;box-shadow:none}.bottom button.active{color:var(--accent);text-shadow:0 0 10px var(--accent);box-shadow:inset 0 -2px 0 var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.player{border-radius:12px;border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 16%,transparent)}
.player button{box-shadow:none;background:transparent}
.progress{height:3px}.progress i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.fullplayer{background-color:var(--bg);background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px),radial-gradient(600px 360px at 50% 18%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%);background-size:32px 32px,32px 32px,auto}
.full-cover{border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 65%,#000),#1a0b2e);box-shadow:0 0 50px color-mix(in srgb,var(--accent) 30%,transparent)}
.bigcontrols button{box-shadow:none;background:transparent}.bigcontrols .playbtn{background:var(--accent);color:var(--onaccent);box-shadow:0 0 28px color-mix(in srgb,var(--accent) 60%,transparent)}
.modal{background:rgba(2,4,8,.78);backdrop-filter:blur(6px)}
.sheet{border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 14%,transparent)}
.color{box-shadow:0 0 10px currentColor}
.toast{background:#0a0f1c;border:1px solid var(--accent);color:#e8f1ff;border-radius:8px;font-size:12.5px;box-shadow:0 0 20px color-mix(in srgb,var(--accent) 35%,transparent)}
hr{border-top-color:var(--line)}
.hero>button.alt{background:transparent!important;color:var(--accent)!important;border:1px solid var(--accent)!important}
.pname{display:block!important;color:var(--ink)!important;font-size:18px!important;letter-spacing:2px}.pname::after{display:none!important}
</style>

<body>
<main id="app"><div class="empty">Chargement de MusicBox…</div></main>
<div class="player" id="miniPlayer"></div>
<div class="bottom"><div class="nav" id="nav"></div></div>
<div class="fullplayer" id="fullPlayer"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<input id="fileInput" type="file" hidden multiple accept=".mp3,.wav,.flac,.aac,.m4a,.ogg,audio/*">
<input id="playlistCoverInput" type="file" hidden accept="image/*">
<audio id="audio" preload="metadata"></audio>

<script>
window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push((e.message||'erreur')+(e.lineno?' (ligne '+e.lineno+')':''))});
setTimeout(function(){
 if(window.__booted)return;
 var a=document.getElementById('app');if(!a||a.querySelector('button'))return;
 a.innerHTML='<div class="card"><h1>MusicBox</h1><p>L’appli n’a pas pu démarrer.</p><p style="word-break:break-word;color:#ff3b5c">'+(window.__errs.join(' | ').replace(/[<>&]/g,'')||'Aucune erreur détectée : le script ne s’est pas lancé.')+'</p><button class="primary" style="width:100%" onclick="location.reload()">Réessayer</button></div>';
},9000);
</script>
<script>
const DB_NAME='musicbox-db-v1', DB_VER=1;
let db, state={
  tab:'home', query:'', filter:'all', sort:'recent', theme:'dark', accent:'#00e5ff',
  profileName:'Mon profil', avatar:'', currentId:null, repeat:'off', shuffle:false,
  folders:[], playlists:[], queue:[], history:[]
};
let songs=new Map(), audio=document.getElementById('audio');

function showFatal(msg){
 const a=document.getElementById('app');if(!a)return;
 a.innerHTML=`<div class="card"><h1>MusicBox</h1><p>Un problème est survenu au démarrage.</p><p style="word-break:break-word;color:var(--danger)">${String(msg).replace(/[<>&]/g,'')}</p><button class="primary" style="width:100%;margin-top:6px" onclick="location.reload()">Réessayer</button><button style="width:100%;margin-top:8px" onclick="continueNoStorage()">Continuer sans sauvegarde</button></div>`;
}
window.addEventListener('error',e=>{if(!window.__booted)showFatal(e.message||'Erreur')});
window.addEventListener('unhandledrejection',e=>{if(!window.__booted)showFatal(e.reason?.message||e.reason||'Erreur')});
async function continueNoStorage(){db=null;try{renderNav();home();renderPlayer();window.__booted=true}catch(e){showFatal(e.message)}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Number(t)||0;let m=Math.floor(t/60),s=Math.floor(t%60);return `${m}:${String(s).padStart(2,'0')}`};
const fmtLong=t=>{t=Number(t)||0;let h=Math.floor(t/3600),m=Math.floor((t%3600)/60);return h?`${h} h ${m} min`:`${m} min`};
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const base=n=>n.replace(/\.[^.]+$/,'');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const colors=['#00e5ff','#39ff14','#ff2bd6','#ff3b3b','#ffb000','#7c5cff','#00ffa3','#ffffff'];

function openDB(){
 return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>reject(new Error('Le stockage local ne répond pas (délai dépassé)')),6000);
  let r;try{r=indexedDB.open(DB_NAME,DB_VER)}catch(e){clearTimeout(timer);return reject(e)}
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id'});if(!d.objectStoreNames.contains('state'))d.createObjectStore('state',{keyPath:'key'});};
  r.onsuccess=()=>{clearTimeout(timer);db=r.result;resolve()};
  r.onerror=()=>{clearTimeout(timer);reject(r.error||new Error('Stockage local indisponible'))};
  r.onblocked=()=>{clearTimeout(timer);reject(new Error('Stockage local bloqué par un autre onglet ou une autre fenêtre'))};
 });
}
const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
async function put(store,obj){if(!db)return;return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function getAll(store){if(!db)return [];return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function del(store,id){if(!db)return;return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function saveState(){await put('state',{key:'main',value:state})}
async function loadState(){let a=await getAll('state');if(a[0]?.value)state={...state,...a[0].value};if(state.design!==2){state.design=2;state.theme='dark';state.accent='#00e5ff'}let a2=await getAll('songs');songs=new Map(a2.map(x=>[x.id,x]));applyTheme()}
function applyTheme(){document.documentElement.dataset.theme=state.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):state.theme;document.documentElement.style.setProperty('--accent',state.accent);let c=state.accent;document.querySelector('meta[name=theme-color]').content=c}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.theme==='auto')applyTheme()});

function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2200)}
function cover(s,cls=''){return `<div class="cover ${cls}">${s.artwork?`<img src="${s.artwork}" alt="">`:esc((s.title||'?')[0]?.toUpperCase()||'?')}</div>`}
function durationTotal(){return [...songs.values()].reduce((a,s)=>a+(Number(s.duration)||0),0)}
function songCount(){return songs.size}

function renderNav(){
 const items=[['home','⌂','Accueil'],['library','♫','Bibliothèque'],['playlists','▤','Playlists'],['profile','●','Profil']];
 $('#nav').innerHTML=items.map(x=>`<button class="${state.tab===x[0]?'active':''}" data-tab="${x[0]}"><div style="font-size:20px">${x[1]}</div>${x[2]}</button>`).join('');
 $('#nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
function go(t){state.tab=t;renderNav();({home,library,playlists,profile}[t]||home)();scrollTo(0,0);saveState()}

function songList(arr,opts={}){
 if(!arr.length)return `<div class="empty">Aucun morceau ici.<br><button class="primary" onclick="document.getElementById('fileInput').click()" style="margin-top:12px">Importer de la musique</button></div>`;
 return `<div>${arr.map(s=>{
  const folder=state.folders.find(f=>f.id===s.folderId);
  const pls=state.playlists.filter(p=>p.songIds.includes(s.id)).length;
  return `<div class="song"><div class="row">${cover(s)}<div class="grow" onclick="playSong('${s.id}')"><div class="title">${esc(s.title)}</div><div class="muted">${esc(s.artist||'Artiste inconnu')} · ${fmt(s.duration)}</div></div><div class="actions">

async function importFiles(files){
 let count=0;
 for(const file of files){
  const id=uid(), title=base(file.name);
  const s={id,title,artist:'',album:'',duration:0,folderId:null,favorite:false,lastPlayed:0,blob:file,type:file.type||'audio/*',name:file.name,createdAt:Date.now()};
  try{const u=URL.createObjectURL(file);const probe=new Audio();probe.preload='metadata';probe.src=u;await new Promise(r=>{probe.onloadedmetadata=()=>{s.duration=probe.duration||0;r()};probe.onerror=()=>r()});URL.revokeObjectURL(u)}catch{}
  await put('songs',s);songs.set(id,s);count++;
 }
 if(count){toast(`${count} morceau${count>1?'x':''} importé${count>1?'s':''}`);go('library')}
}

async function playSong(id){
 const s=songs.get(id);if(!s)return;
 if(!s.blob){toast('Fichier non disponible, réimporte-le');return}
 state.currentId=id;s.lastPlayed=Date.now();state.history=[id,...state.history.filter(x=>x!==id)].slice(0,50);await put('songs',s);await saveState();
 audio.src=URL.createObjectURL(s.blob);audio.play().catch(()=>{});renderPlayer();setMediaSession(s);
}
function playShuffle(ids){
 ids=(ids&&ids.length)?ids:[...songs.keys()];
 if(!ids.length){toast('Aucun morceau à lire');return}
 state.shuffle=true;state.queue=ids;saveState();
 playSong(ids[Math.floor(Math.random()*ids.length)]);toast('Lecture aléatoire');updateModeButtons()
}
function playQueue(ids){state.queue=ids;let first=ids[0];if(first)playSong(first)}
function current(){return state.currentId?songs.get(state.currentId):null}
function nextSong(){
 let ids=state.queue.length?state.queue:[...songs.keys()];
 if(!ids.length)return;
 let i=ids.indexOf(state.currentId),n;
 if(state.shuffle){do{n=ids[Math.floor(Math.random()*ids.length)]}while(ids.length>1&&n===state.currentId)}else n=ids[(i+1)%ids.length];
 if(state.repeat==='one')n=state.currentId;
 playSong(n)
}
function prevSong(){let ids=state.queue.length?state.queue:[...songs.keys()],i=ids.indexOf(state.currentId);playSong(ids[(i-1+ids.length)%ids.length])}
function stop(){audio.pause();if(audio.src)URL.revokeObjectURL(audio.src);audio.removeAttribute('src');audio.load();state.currentId=null;renderPlayer()}
function renderPlayer(){
 const s=current();let p=$('#miniPlayer');if(!s){p.classList.remove('show');$('#fullPlayer').classList.remove('show');return}
 p.classList.add('show');p.innerHTML=`<div class="mini" onclick="openFullPlayer()">${cover(s)}<div class="grow"><div class="title">${esc(s.title)}</div><div class="muted">${esc(s.artist||'Artiste inconnu')}</div></div><button onclick="event.stopPropagation();audio.paused?audio.play():audio.pause()">▶</button><button onclick="event.stopPropagation();nextSong()">›</button></div><div class="progress"><i id="miniProg"></i></div>`;
}
function openFullPlayer(){
 const s=current();if(!s)return;let fp=$('#fullPlayer');fp.classList.add('show');fp.innerHTML=`<div class="top"><button class="icon" onclick="closeFullPlayer()">↓</button><div class="grow" style="text-align:center;font-weight:800">LECTEUR</div><button class="icon" onclick="songMenu('${s.id}')">⋮</button></div>
 <div class="full-cover">${s.artwork?`<img src="${s.artwork}" alt="">`:esc((s.title[0]||'?').toUpperCase())}</div><div style="text-align:center"><h2 style="margin:0">${esc(s.title)}</h2><p>${esc(s.artist||'Artiste inconnu')}${s.album?' · '+esc(s.album):''}</p></div>
 <input class="range" id="seek" type="range" min="0" max="${s.duration||0}" value="${audio.currentTime||0}" step=".1"><div class="row muted"><span id="cur">0:00</span><div class="grow"></div><span>${fmt(s.duration)}</span></div>
 <div class="bigcontrols"><button class="modebtn" id="shuffleBtn" onclick="toggleShuffle()">🔀<i class="slash"></i></button><button onclick="prevSong()">⏮</button><button class="playbtn" id="bigPlay" onclick="togglePlay()">▶</button><button onclick="nextSong()">⏭</button><button class="modebtn" id="repeatBtn" onclick="toggleRepeat()">↻<i class="slash"></i></button></div>
 <label>Volume</label><input class="range" id="vol" type="range" min="0" max="1" step=".01" value="${audio.volume}">`;
 $('#seek').oninput=e=>audio.currentTime=+e.target.value;$('#vol').oninput=e=>audio.volume=+e.target.value;updateFullControls()
}
function closeFullPlayer(){$('#fullPlayer').classList.remove('show')}
function togglePlay(){audio.paused?audio.play():audio.pause();updateFullControls()}
function toggleShuffle(){state.shuffle=!state.shuffle;saveState();updateModeButtons()}
function toggleRepeat(){state.repeat=state.repeat==='off'?'all':state.repeat==='all'?'one':'off';saveState();updateModeButtons()}
function updateModeButtons(){
  const sh=$('#shuffleBtn');
  if(sh){
    sh.classList.toggle('active',state.shuffle);
    sh.classList.toggle('off',!state.shuffle);
    sh.querySelector('.slash')?.style.setProperty('display',state.shuffle?'none':'block');
    sh.title=state.shuffle?'Aléatoire activé':'Aléatoire désactivé';
  }
  const rp=$('#repeatBtn');
  if(rp){
    const on=state.repeat!=='off';
    rp.classList.toggle('active',on);
    rp.classList.toggle('off',!on);
    rp.querySelector('.slash')?.style.setProperty('display',on?'none':'block');
    rp.querySelector('.dot')?.remove();
    rp.querySelector('.one')?.remove();
    if(state.repeat==='all'){
      const d=document.createElement('i'); d.className='dot'; rp.appendChild(d);
      rp.title='Lecture en boucle activée';
    }else if(state.repeat==='one'){
      const o=document.createElement('i'); o.className='one'; o.textContent='1'; rp.appendChild(o);
      rp.title='Répéter ce morceau';
    }else rp.title='Boucle désactivée';
  }
}
audio.addEventListener('timeupdate',()=>{let s=current();if(!s)return;let m=$('#miniProg');if(m)m.style.width=(audio.currentTime/(s.duration||1)*100)+'%';let seek=$('#seek');if(seek)seek.value=audio.currentTime;let cur=$('#cur');if(cur)cur.textContent=fmt(audio.currentTime);});
audio.addEventListener('play',()=>{let b=$('#bigPlay');if(b)b.textContent='Ⅱ';renderPlayer()});
audio.addEventListener('pause',()=>{let b=$('#bigPlay');if(b)b.textContent='▶';renderPlayer()});
audio.addEventListener('ended',()=>{if(state.repeat==='one'){audio.currentTime=0;audio.play();}else nextSong()});
function updateFullControls(){let b=$('#bigPlay');if(b)b.textContent=audio.paused?'▶':'Ⅱ';let v=$('#vol');if(v)v.value=audio.volume;updateModeButtons()}
function setMediaSession(s){
 if(!('mediaSession' in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||'Artiste inconnu',album:s.album||'MusicBox'});
 navigator.mediaSession.setActionHandler?.('play',()=>audio.play());
 navigator.mediaSession.setActionHandler?.('pause',()=>audio.pause());
 navigator.mediaSession.setActionHandler?.('previoustrack',prevSong);
 navigator.mediaSession.setActionHandler?.('nexttrack',nextSong);
 navigator.mediaSession.setActionHandler?.('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-10));
 navigator.mediaSession.setActionHandler?.('seekforward',()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10));
}

let crop=null;
function openCropper(src,onDone){
 const img=new Image();
 img.onload=()=>{
  const V=280,min=Math.max(V/img.width,V/img.height);
  crop={img,V,min,scale:min,x:(V-img.width*min)/2,y:(V-img.height*min)/2,onDone};
  $('#modal').classList.add('show');
  $('#modal').innerHTML=`<div class="sheet"><h2>Recadrer la photo</h2><p>Glisse pour déplacer, utilise le curseur pour zoomer.</p><canvas id="cropCv" width="${V}" height="${V}" style="display:block;margin:0 auto;border-radius:20px;touch-action:none;max-width:100%;background:#000"></canvas><input class="range" id="cropZoom" type="range" min="1" max="4" step=".01" value="1" style="margin-top:14px"><div class="grid2" style="margin-top:12px"><button onclick="crop=null;closeModal()">Annuler</button><button class="primary" onclick="applyCrop()">Valider</button></div></div>`;
  const c=$('#cropCv');let drag=null;
  c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drag)return;const k=V/c.getBoundingClientRect().width;crop.x+=(e.clientX-drag.x)*k;crop.y+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};clampCrop();drawCrop()};
  c.onpointerup=c.onpointercancel=()=>drag=null;
  $('#cropZoom').oninput=e=>{const ns=crop.min*(+e.target.value),cx=(V/2-crop.x)/crop.scale,cy=(V/2-crop.y)/crop.scale;crop.scale=ns;crop.x=V/2-cx*ns;crop.y=V/2-cy*ns;clampCrop();drawCrop()};
  drawCrop();
 };
 img.onerror=()=>toast('Image illisible');
 img.src=src;
}
function clampCrop(){const{img,V,scale}=crop;crop.x=Math.min(0,Math.max(V-img.width*scale,crop.x));crop.y=Math.min(0,Math.max(V-img.height*scale,crop.y))}
function drawCrop(){const c=$('#cropCv');if(!c||!crop)return;const g=c.getContext('2d'),{img,V,scale,x,y}=crop;g.fillStyle='#000';g.fillRect(0,0,V,V);g.drawImage(img,x,y,img.width*scale,img.height*scale)}
async function applyCrop(){
 if(!crop)return;const{img,V,scale,x,y,onDone}=crop;
 try{const o=document.createElement('canvas');o.width=o.height=512;o.getContext('2d').drawImage(img,-x/scale,-y/scale,V/scale,V/scale,0,0,512,512);const url=o.toDataURL('image/jpeg',.88);crop=null;await onDone(url)}
 catch(e){toast('Recadrage impossible pour cette image')}
}
function choosePlaylistCover(id){
 const input=$('#playlistCoverInput');
 input.onchange=e=>{
  const file=e.target.files?.[0];input.value='';if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>openCropper(reader.result,url=>savePlaylistCover(id,url));
  reader.readAsDataURL(file);
 };
 input.click();
}
async function savePlaylistCover(id,url){const p=state.playlists.find(x=>x.id===id);if(!p)return;p.cover=url;p.coverCustom=true;await saveState();closeModal();playlists();toast('Photo enregistrée')}
function recropPlaylistCover(id){const p=state.playlists.find(x=>x.id===id);if(p?.cover)openCropper(p.cover,url=>savePlaylistCover(id,url))}

/* ===== Mise à jour depuis GitHub ===== */
const GITHUB_REPO='Ak3no-exe/Music';
function githubSettings(){
 const g=state.github||{};
 const r=prompt('Dépôt GitHub (pseudo/nom-du-depot)',g.repo||'');if(r===null)return;
 const b=prompt('Branche',g.branch||'main');if(b===null)return;
 state.github={...g,repo:r.trim(),branch:b.trim()||'main'};saveState();profile();toast('Dépôt enregistré')
}
async function hardReload(){
 try{for(const r of await navigator.serviceWorker?.getRegistrations()||[])await r.unregister()}catch{}
 try{for(const k of await caches.keys())await caches.delete(k)}catch{}
 const u=new URL(location.href);u.searchParams.set('v',Date.now());
 setTimeout(()=>location.replace(u.toString()),700)
}
async function updateApp(){
 const g=state.github=state.github||{};g.repo=GITHUB_REPO;toast('Recherche de mise à jour…');
 try{
  const r=await fetch(`https://api.github.com/repos/${GITHUB_REPO}/commits/${g.branch||'HEAD'}`,{cache:'no-store'});
  if(!r.ok)throw new Error(r.status);
  const sha=(await r.json()).sha;
  if(sha===g.sha){toast('MusicBox est déjà à jour');return}
  g.sha=sha;await saveState();toast('Mise à jour trouvée, rechargement…');
 }catch{toast('GitHub injoignable, rechargement forcé…')}
 await hardReload()
}

async function init(){
 await openDB();await loadState();renderNav();home();renderPlayer();window.__booted=true
}
init().catch(e=>{console.error(e);showFatal(e?.message||e)});
</script>
