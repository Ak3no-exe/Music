<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7c5cff">
<title>MusicBox</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#151622;--muted:#707386;--line:#e2e4ec;--accent:#7c5cff;--accent2:#6547ed;--onaccent:#fff;--danger:#d94b5b;--shadow:0 10px 30px rgba(25,20,60,.08)}
:root[data-theme=dark]{--bg:#0d0e14;--card:#171820;--ink:#f5f5fb;--muted:#a2a4b2;--line:#292b35;--shadow:0 12px 35px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:92px;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
button.danger{color:var(--danger)}
button.icon{width:44px;height:44px;padding:0;display:grid;place-items:center}
input,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
main{width:min(720px,100%);margin:auto;padding:18px 16px 24px}
h1{font-size:30px;margin:0 0 7px;letter-spacing:-.6px}
h2{font-size:20px;margin:25px 0 12px}
p{color:var(--muted);margin:6px 0 14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top .grow{flex:1}
.brand{font-weight:900;font-size:22px}.brand span{color:var(--accent)}
.search{position:relative;margin:10px 0 16px}.search input{padding-left:44px}
.search b{position:absolute;left:15px;top:11px;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow);margin:10px 0 18px}
.hero h2{margin:0 0 6px;font-size:25px}.hero p{color:#fff;opacity:.88}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:rgba(255,255,255,.14);border-radius:15px;padding:11px}.stat b{display:block;font-size:19px}.stat small{opacity:.78}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:13px}
.cover{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--accent),#222);color:#fff;font-weight:900;font-size:20px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}
.song{padding:9px 0}.song+.song{border-top:1px solid var(--line)}.song .cover{width:50px;height:50px;border-radius:13px}
.song .actions{display:flex;gap:5px}.song .actions button{border:0;background:transparent;padding:7px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}.chips button{white-space:nowrap}.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:35px 10px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom))}
.bottom .nav{display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:auto}.bottom button{border:0;background:transparent;padding:8px 3px;border-radius:13px;color:var(--muted);font-size:12px}.bottom button.active{color:var(--accent);font-weight:800;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.player{position:fixed;left:8px;right:8px;bottom:76px;z-index:25;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 10px;box-shadow:var(--shadow);display:none}.player.show{display:block}.player .mini{display:flex;align-items:center;gap:9px}.player .cover{width:44px;height:44px;border-radius:11px}.player .grow{overflow:hidden}.player button{border:0;background:transparent;padding:8px}.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:7px 0 2px}.progress i{display:block;height:100%;width:0;background:var(--accent)}
.fullplayer{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));overflow:auto}.fullplayer.show{display:block}.full-cover{width:min(76vw,330px);aspect-ratio:1;margin:42px auto 25px;border-radius:28px;background:linear-gradient(135deg,var(--accent),#1b1b22);display:grid;place-items:center;color:#fff;font-size:70px;font-weight:900;overflow:hidden;box-shadow:var(--shadow)}.full-cover img{width:100%;height:100%;object-fit:cover}.bigcontrols{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0}.bigcontrols button{border:0;background:transparent;font-size:25px}.bigcontrols .playbtn{width:68px;height:68px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px}
.range{width:100%;accent-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);display:none;align-items:flex-end;padding:10px}.modal.show{display:flex}.sheet{background:var(--card);width:min(720px,100%);margin:auto;border-radius:24px;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.closex{float:right}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
.colorrow{display:flex;gap:9px;flex-wrap:wrap}.color{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);outline:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);z-index:100;background:#151622;color:#fff;padding:11px 15px;border-radius:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}.hero{padding:17px}.grid2{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:9px 7px}}
</style>
</head>
<body>
<main id="app"></main>
<div class="player" id="miniPlayer"></div>
<div class="bottom"><div class="nav" id="nav"></div></div>
<div class="fullplayer" id="fullPlayer"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<input id="fileInput" type="file" hidden multiple accept=".mp3,.wav,.flac,.aac,.m4a,.ogg,audio/*">
<audio id="audio" preload="metadata"></audio>

<script>
const DB_NAME='musicbox-db-v1', DB_VER=1;
let db, state={
  tab:'home', query:'', filter:'all', sort:'recent', theme:'auto', accent:'#7c5cff',
  profileName:'Mon profil', avatar:'', currentId:null, repeat:'off', shuffle:false,
  folders:[], playlists:[], queue:[], history:[]
};
let songs=new Map(), audio=document.getElementById('audio');

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Number(t)||0;let m=Math.floor(t/60),s=Math.floor(t%60);return `${m}:${String(s).padStart(2,'0')}`};
const fmtLong=t=>{t=Number(t)||0;let h=Math.floor(t/3600),m=Math.floor((t%3600)/60);return h?`${h} h ${m} min`:`${m} min`};
const ext=n=>(n.split('.').pop()||'').toLowerCase();
const base=n=>n.replace(/\.[^.]+$/,'');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const colors=['#7c5cff','#ff4f81','#ff8a34','#19a974','#1597e5','#00a8a8','#eab308','#ef4444'];

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id'});if(!d.objectStoreNames.contains('state'))d.createObjectStore('state',{keyPath:'key'});};
  r.onsuccess=()=>{db=r.result;resolve()};
  r.onerror=()=>reject(r.error);
 });
}
const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
async function put(store,obj){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function getAll(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function saveState(){await put('state',{key:'main',value:state})}
async function loadState(){let a=await getAll('state');if(a[0]?.value)state={...state,...a[0].value};let a2=await getAll('songs');songs=new Map(a2.map(x=>[x.id,x]));applyTheme()}
function applyTheme(){document.documentElement.dataset.theme=state.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):state.theme;document.documentElement.style.setProperty('--accent',state.accent);let c=state.accent;document.querySelector('meta[name=theme-color]').content=c}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.theme==='auto')applyTheme()});

function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2200)}
function cover(s,cls=''){return `<div class="cover ${cls}">${s.artwork?`<img src="${s.artwork}" alt="">`:esc((s.title||'?')[0]?.toUpperCase()||'?')}</div>`}
function durationTotal(){return [...songs.values()].reduce((a,s)=>a+(Number(s.duration)||0),0)}
function songCount(){return songs.size}

function renderNav(){
 const items=[['home','⌂','Accueil'],['library','♫','Bibliothèque'],['playlists','▤','Playlists'],['profile','●','Profil']];
 $('#nav').innerHTML=items.map(x=>`<button class="${state.tab===x[0]?'active':''}" data-tab="${x[0]}"><div style="font-size:20px">${x[1]}</div>${x[2]}</button>`).join('');
 $('#nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
function go(t){state.tab=t;renderNav();({home,library,playlists,profile}[t]||home)();scrollTo(0,0);saveState()}

function songList(arr,opts={}){
 if(!arr.length)return `<div class="empty">Aucun morceau ici.<br><button class="primary" onclick="document.getElementById('fileInput').click()" style="margin-top:12px">Importer de la musique</button></div>`;
 return `<div>${arr.map(s=>{
  const folder=state.folders.find(f=>f.id===s.folderId);
  const pls=state.playlists.filter(p=>p.songIds.includes(s.id)).length;
  return `<div class="song"><div class="row">${cover(s)}<div class="grow" onclick="playSong('${s.id}')"><div class="title">${esc(s.title)}</div><div class="muted">${esc(s.artist||'Artiste inconnu')} · ${fmt(s.duration)}</div></div><div class="actions">
  <button onclick="toggleFav('${s.id}')" aria-label="Favori">${s.favorite?'♥':'♡'}</button>
  <button onclick="songMenu('${s.id}')">⋮</button></div></div></div>`;
 }).join('')}</div>`
}

function header(title,sub=''){
 return `<div class="top"><div class="brand">Music<span>Box</span></div><div class="grow"></div><button class="icon" onclick="openSettings()">⚙</button></div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}`
}

function home(){
 const all=[...songs.values()], recent=all.filter(s=>s.lastPlayed).sort((a,b)=>b.lastPlayed-a.lastPlayed).slice(0,5), fav=all.filter(s=>s.favorite).slice(0,5);
 $('#app').innerHTML=header('Salut 👋',`Ta musique, au même endroit. ${all.length} morceau${all.length>1?'x':''} dans ta bibliothèque.`)+
 `<div class="hero"><h2>Prêt à écouter ?</h2><p>Importe tes fichiers audio et MusicBox les garde dans l'application.</p>
 <div class="stats"><div class="stat"><b>${all.length}</b><small>Morceaux</small></div><div class="stat"><b>${state.playlists.length}</b><small>Playlists</small></div><div class="stat"><b>${fmtLong(durationTotal())}</b><small>Musique</small></div></div>
 <button onclick="document.getElementById('fileInput').click()" style="margin-top:15px;background:#fff;color:#222;border:0;font-weight:800">＋ Importer</button></div>
 <div class="search"><b>⌕</b><input id="globalSearch" placeholder="Rechercher un morceau, artiste..." value="${esc(state.query)}"></div>
 ${recent.length?`<h2>Écoutés récemment</h2>${songList(recent)}`:''}
 ${fav.length?`<h2>Favoris</h2>${songList(fav)}`:''}
 <h2>Accès rapide</h2><div class="grid2"><button class="card" onclick="go('library')" style="text-align:left"><b>♫ Bibliothèque</b><div class="muted">${all.length} morceaux</div></button><button class="card" onclick="go('playlists')" style="text-align:left"><b>▤ Playlists</b><div class="muted">${state.playlists.length} playlists</div></button></div>`;
 $('#globalSearch').oninput=e=>{state.query=e.target.value;library()};
}

function library(){
 const all=[...songs.values()];
 let arr=all.filter(s=>(!state.query||`${s.title} ${s.artist} ${s.album}`.toLowerCase().includes(state.query.toLowerCase())));
 if(state.filter==='fav')arr=arr.filter(s=>s.favorite);
 if(state.filter.startsWith('folder:'))arr=arr.filter(s=>s.folderId===state.filter.slice(7));
 if(state.sort==='title')arr.sort((a,b)=>a.title.localeCompare(b.title));
 if(state.sort==='artist')arr.sort((a,b)=>(a.artist||'').localeCompare(b.artist||''));
 if(state.sort==='duration')arr.sort((a,b)=>b.duration-a.duration);
 if(state.sort==='recent')arr.sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));
 $('#app').innerHTML=header('Bibliothèque',`${all.length} morceau${all.length>1?'x':''}`)+
 `<div class="search"><b>⌕</b><input id="search" placeholder="Rechercher..." value="${esc(state.query)}"></div>
 <div class="chips"><button class="${state.filter==='all'?'on':''}" onclick="setFilter('all')">Tous</button><button class="${state.filter==='fav'?'on':''}" onclick="setFilter('fav')">♥ Favoris</button>${state.folders.map(f=>`<button class="${state.filter==='folder:'+f.id?'on':''}" onclick="setFilter('folder:${f.id}')">${esc(f.name)}</button>`).join('')}</div>
 <div class="row" style="margin-bottom:10px"><div class="grow"></div><select id="sort" style="width:auto"><option value="recent">Récents</option><option value="title">Titre</option><option value="artist">Artiste</option><option value="duration">Durée</option></select></div>
 ${songList(arr)}`;
 $('#search').oninput=e=>{state.query=e.target.value;library()};$('#sort').value=state.sort;$('#sort').onchange=e=>{state.sort=e.target.value;library()};
}

function setFilter(f){state.filter=f;library()}
function toggleFav(id){let s=songs.get(id);if(!s)return;s.favorite=!s.favorite;put('songs',s).then(()=>{toast(s.favorite?'Ajouté aux favoris':'Retiré des favoris');({home,library,playlists,profile}[state.tab]())})}

function songMenu(id){
 let s=songs.get(id);if(!s)return;
 $('#modal').classList.add('show');
 $('#modal').innerHTML=`<div class="sheet"><button class="icon closex" onclick="closeModal()">×</button><h2>${esc(s.title)}</h2>
 <button style="width:100%;margin:5px 0" onclick="playSong('${id}');closeModal()">▶ Lire</button>
 <button style="width:100%;margin:5px 0" onclick="addToPlaylistPrompt('${id}')">＋ Ajouter à une playlist</button>
 <button style="width:100%;margin:5px 0" onclick="moveToFolderPrompt('${id}')">▣ Déplacer dans un dossier</button>
 <button style="width:100%;margin:5px 0" onclick="editSongPrompt('${id}')">✎ Modifier les infos</button>
 <button class="danger" style="width:100%;margin:5px 0" onclick="deleteSong('${id}')">Supprimer de MusicBox</button></div>`;
}
function closeModal(){$('#modal').classList.remove('show');$('#modal').innerHTML=''}

async function deleteSong(id){
 let s=songs.get(id);if(!s)return;
 if(!confirm(`Supprimer « ${s.title} » de MusicBox ?\\nLe fichier original de ton téléphone n'est pas supprimé.`))return;
 await del('songs',id);songs.delete(id);state.playlists.forEach(p=>p.songIds=p.songIds.filter(x=>x!==id));await saveState();closeModal();library();toast('Morceau supprimé')}
function editSongPrompt(id){
 let s=songs.get(id);$('#modal').innerHTML=`<div class="sheet"><button class="icon closex" onclick="closeModal()">×</button><h2>Modifier le morceau</h2>
 <label>Titre</label><input id="edTitle" value="${esc(s.title)}"><label>Artiste</label><input id="edArtist" value="${esc(s.artist||'')}"><label>Album</label><input id="edAlbum" value="${esc(s.album||'')}"><button class="primary" style="width:100%;margin-top:15px" onclick="saveEdit('${id}')">Enregistrer</button></div>`;
}
async function saveEdit(id){let s=songs.get(id);s.title=$('#edTitle').value.trim()||s.title;s.artist=$('#edArtist').value.trim();s.album=$('#edAlbum').value.trim();await put('songs',s);songs.set(id,s);closeModal();library();toast('Informations enregistrées')}

function playlists(){
 $('#app').innerHTML=header('Playlists','Crée et organise tes playlists.')+
 `<button class="primary" style="width:100%;margin-bottom:12px" onclick="createPlaylist()">＋ Nouvelle playlist</button>`+
 (state.playlists.length?state.playlists.map(p=>`<div class="card row" onclick="openPlaylist('${p.id}')"><div class="cover">♫</div><div class="grow"><div class="title">${esc(p.name)}</div><div class="muted">${p.songIds.length} morceau${p.songIds.length>1?'x':''}</div></div><button onclick="event.stopPropagation();playlistMenu('${p.id}')">⋮</button></div>`).join(''):`<div class="empty">Aucune playlist pour le moment.</div>`);
}
function createPlaylist(){
 $('#modal').classList.add('show');$('#modal').innerHTML=`<div class="sheet"><h2>Nouvelle playlist</h2><label>Nom</label><input id="plName" placeholder="Ma playlist"><button class="primary" style="width:100%;margin-top:14px" onclick="saveNewPlaylist()">Créer</button></div>`;
}
async function saveNewPlaylist(){let n=$('#plName').value.trim();if(!n)return;let p={id:uid(),name:n,songIds:[]};state.playlists.push(p);await saveState();closeModal();playlists();toast('Playlist créée')}
function openPlaylist(id){
 let p=state.playlists.find(x=>x.id===id);if(!p)return;let arr=p.songIds.map(x=>songs.get(x)).filter(Boolean);
 $('#app').innerHTML=`<div class="top"><button class="icon" onclick="go('playlists')">←</button><div class="grow"><div class="brand">${esc(p.name)}</div><div class="muted">${arr.length} morceaux</div></div><button onclick="playlistMenu('${id}')">⋮</button></div>
 <button class="primary" style="width:100%;margin-bottom:12px" onclick="playQueue(${JSON.stringify(arr.map(s=>s.id)).replace(/"/g,'&quot;')})">▶ Lire tout</button>${songList(arr)}`;
}
function playlistMenu(id){
 let p=state.playlists.find(x=>x.id===id);$('#modal').classList.add('show');$('#modal').innerHTML=`<div class="sheet"><h2>${esc(p.name)}</h2><button style="width:100%;margin:5px 0" onclick="renamePlaylist('${id}')">✎ Renommer</button><button class="danger" style="width:100%;margin:5px 0" onclick="deletePlaylist('${id}')">Supprimer</button></div>`;
}
async function renamePlaylist(id){let p=state.playlists.find(x=>x.id===id),n=prompt('Nouveau nom',p.name);if(n?.trim()){p.name=n.trim();await saveState();closeModal();playlists()}}
async function deletePlaylist(id){if(!confirm('Supprimer cette playlist ?'))return;state.playlists=state.playlists.filter(x=>x.id!==id);await saveState();closeModal();playlists()}
function addToPlaylistPrompt(id){
 if(!state.playlists.length){closeModal();createPlaylist();return}
 $('#modal').innerHTML=`<div class="sheet"><h2>Ajouter à une playlist</h2>${state.playlists.map(p=>`<button style="width:100%;margin:5px 0;text-align:left" onclick="addSongToPlaylist('${p.id}','${id}')">${esc(p.name)} · ${p.songIds.length}</button>`).join('')}</div>`;
}
async function addSongToPlaylist(pid,sid){let p=state.playlists.find(x=>x.id===pid);if(!p.songIds.includes(sid))p.songIds.push(sid);await saveState();closeModal();toast('Ajouté à la playlist')}
function moveToFolderPrompt(id){
 $('#modal').innerHTML=`<div class="sheet"><h2>Dossier</h2><button style="width:100%;margin:5px 0" onclick="moveSong('${id}',null)">Sans dossier</button>${state.folders.map(f=>`<button style="width:100%;margin:5px 0;text-align:left" onclick="moveSong('${id}','${f.id}')">${esc(f.name)}</button>`).join('')}<button style="width:100%;margin-top:10px" onclick="createFolder('${id}')">＋ Nouveau dossier</button></div>`;
}
async function moveSong(id,fid){let s=songs.get(id);s.folderId=fid;await put('songs',s);songs.set(id,s);closeModal();library();toast('Dossier modifié')}
function createFolder(songId=null){
 $('#modal').innerHTML=`<div class="sheet"><h2>Nouveau dossier</h2><label>Nom</label><input id="folderName" placeholder="Ex. Chill"><button class="primary" style="width:100%;margin-top:14px" onclick="saveFolder('${songId||''}')">Créer</button></div>`;
}
async function saveFolder(songId){let n=$('#folderName').value.trim();if(!n)return;let f={id:uid(),name:n};state.folders.push(f);if(songId){let s=songs.get(songId);s.folderId=f.id;await put('songs',s);songs.set(songId,s)}await saveState();closeModal();library();toast('Dossier créé')}

function profile(){
 $('#app').innerHTML=header('Profil','Tout reste local sur ton téléphone.')+
 `<div class="card" style="text-align:center;padding:25px"><div class="full-cover" style="width:110px;height:110px;margin:0 auto 14px;border-radius:50%;font-size:35px">${state.avatar?`<img src="${state.avatar}" alt="">`:(state.profileName[0]||'M').toUpperCase()}</div><h2 style="margin:0">${esc(state.profileName)}</h2><p>${songs.size} morceaux · ${state.playlists.length} playlists</p><button onclick="editProfile()">Modifier le profil</button></div>
 <h2>Apparence</h2><div class="card"><label>Thème</label><select id="theme"><option value="auto">Automatique</option><option value="light">Clair</option><option value="dark">Sombre</option></select><label>Couleur</label><div class="colorrow">${colors.map(c=>`<button class="color" style="background:${c}" onclick="setAccent('${c}')"></button>`).join('')}<input id="customColor" type="color" value="${state.accent}" style="width:42px;height:42px;padding:0"></div></div>
 <h2>Données</h2><div class="grid2"><button onclick="exportData()">Exporter</button><button onclick="document.getElementById('backupInput').click()">Importer</button></div>
 <input id="backupInput" type="file" hidden accept="application/json" onchange="importData(this.files[0])">
 <div class="card" style="margin-top:10px"><b>Stockage local</b><p>Les morceaux importés sont conservés dans MusicBox. La suppression d'un morceau ici ne supprime pas l'original présent ailleurs sur ton téléphone.</p><button class="danger" onclick="clearLibrary()">Vider MusicBox</button></div>`;
 $('#theme').value=state.theme;$('#theme').onchange=e=>{state.theme=e.target.value;applyTheme();saveState()};$('#customColor').onchange=e=>setAccent(e.target.value);
}
function openSettings(){go('profile')}
function editProfile(){let n=prompt('Nom du profil',state.profileName);if(n?.trim()){state.profileName=n.trim();saveState();profile()}}
function setAccent(c){state.accent=c;applyTheme();saveState();profile()}
async function clearLibrary(){if(!confirm('Supprimer tous les morceaux de MusicBox ? Les originaux du téléphone ne seront pas supprimés.'))return;for(let s of songs.values())await del('songs',s.id);songs.clear();state.playlists=[];state.folders=[];state.currentId=null;await saveState();stop();profile();toast('Bibliothèque vidée')}

async function exportData(){
 const data={version:1,profileName:state.profileName,theme:state.theme,accent:state.accent,folders:state.folders,playlists:state.playlists,songs:[...songs.values()].map(({blob,...x})=>x)};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='musicbox-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Sauvegarde exportée')}
async function importData(file){
 if(!file)return;try{let d=JSON.parse(await file.text());state.profileName=d.profileName||state.profileName;state.theme=d.theme||state.theme;state.accent=d.accent||state.accent;state.folders=d.folders||[];state.playlists=d.playlists||[];await saveState();applyTheme();profile();toast('Configuration restaurée')}catch(e){toast('Sauvegarde invalide')}}

async function importFiles(files){
 let count=0;
 for(const file of files){
  const id=uid(), title=base(file.name);
  const s={id,title,artist:'',album:'',duration:0,folderId:null,favorite:false,lastPlayed:0,blob:file,type:file.type||'audio/*',name:file.name,createdAt:Date.now()};
  try{const u=URL.createObjectURL(file);const probe=new Audio();probe.preload='metadata';probe.src=u;await new Promise(r=>{probe.onloadedmetadata=()=>{s.duration=probe.duration||0;r()};probe.onerror=()=>r()});URL.revokeObjectURL(u)}catch{}
  await put('songs',s);songs.set(id,s);count++;
 }
 if(count){toast(`${count} morceau${count>1?'x':''} importé${count>1?'s':''}`);go('library')}
}
$('#fileInput').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};

async function playSong(id){
 const s=songs.get(id);if(!s)return;
 if(!s.blob){toast('Fichier non disponible, réimporte-le');return}
 state.currentId=id;s.lastPlayed=Date.now();state.history=[id,...state.history.filter(x=>x!==id)].slice(0,50);await put('songs',s);await saveState();
 audio.src=URL.createObjectURL(s.blob);audio.play().catch(()=>{});renderPlayer();setMediaSession(s);
}
function playQueue(ids){state.queue=ids;let first=ids[0];if(first)playSong(first)}
function current(){return state.currentId?songs.get(state.currentId):null}
function nextSong(){
 let ids=state.queue.length?state.queue:[...songs.keys()];
 if(!ids.length)return;
 let i=ids.indexOf(state.currentId),n;
 if(state.shuffle)n=ids[Math.floor(Math.random()*ids.length)];else n=ids[(i+1)%ids.length];
 if(state.repeat==='one')n=state.currentId;
 playSong(n)
}
function prevSong(){let ids=state.queue.length?state.queue:[...songs.keys()],i=ids.indexOf(state.currentId);playSong(ids[(i-1+ids.length)%ids.length])}
function stop(){audio.pause();if(audio.src)URL.revokeObjectURL(audio.src);audio.removeAttribute('src');audio.load();state.currentId=null;renderPlayer()}
function renderPlayer(){
 const s=current();let p=$('#miniPlayer');if(!s){p.classList.remove('show');$('#fullPlayer').classList.remove('show');return}
 p.classList.add('show');p.innerHTML=`<div class="mini" onclick="openFullPlayer()">${cover(s)}<div class="grow"><div class="title">${esc(s.title)}</div><div class="muted">${esc(s.artist||'Artiste inconnu')}</div></div><button onclick="event.stopPropagation();audio.paused?audio.play():audio.pause()">▶</button><button onclick="event.stopPropagation();nextSong()">›</button></div><div class="progress"><i id="miniProg"></i></div>`;
}
function openFullPlayer(){
 const s=current();if(!s)return;let fp=$('#fullPlayer');fp.classList.add('show');fp.innerHTML=`<div class="top"><button class="icon" onclick="closeFullPlayer()">↓</button><div class="grow" style="text-align:center;font-weight:800">LECTEUR</div><button class="icon" onclick="songMenu('${s.id}')">⋮</button></div>
 <div class="full-cover">${s.artwork?`<img src="${s.artwork}" alt="">`:esc((s.title[0]||'?').toUpperCase())}</div><div style="text-align:center"><h2 style="margin:0">${esc(s.title)}</h2><p>${esc(s.artist||'Artiste inconnu')}${s.album?' · '+esc(s.album):''}</p></div>
 <input class="range" id="seek" type="range" min="0" max="${s.duration||0}" value="${audio.currentTime||0}" step=".1"><div class="row muted"><span id="cur">0:00</span><div class="grow"></div><span>${fmt(s.duration)}</span></div>
 <div class="bigcontrols"><button onclick="toggleShuffle()">🔀</button><button onclick="prevSong()">⏮</button><button class="playbtn" id="bigPlay" onclick="togglePlay()">▶</button><button onclick="nextSong()">⏭</button><button onclick="toggleRepeat()">↻</button></div>
 <label>Volume</label><input class="range" id="vol" type="range" min="0" max="1" step=".01" value="${audio.volume}">`;
 $('#seek').oninput=e=>audio.currentTime=+e.target.value;$('#vol').oninput=e=>audio.volume=+e.target.value;updateFullControls()
}
function closeFullPlayer(){$('#fullPlayer').classList.remove('show')}
function togglePlay(){audio.paused?audio.play():audio.pause();updateFullControls()}
function toggleShuffle(){state.shuffle=!state.shuffle;saveState();openFullPlayer()}
function toggleRepeat(){state.repeat=state.repeat==='off'?'all':state.repeat==='all'?'one':'off';saveState();openFullPlayer()}
audio.addEventListener('timeupdate',()=>{let s=current();if(!s)return;let m=$('#miniProg');if(m)m.style.width=(audio.currentTime/(s.duration||1)*100)+'%';let seek=$('#seek');if(seek)seek.value=audio.currentTime;let cur=$('#cur');if(cur)cur.textContent=fmt(audio.currentTime);});
audio.addEventListener('play',()=>{let b=$('#bigPlay');if(b)b.textContent='Ⅱ';renderPlayer()});
audio.addEventListener('pause',()=>{let b=$('#bigPlay');if(b)b.textContent='▶';renderPlayer()});
audio.addEventListener('ended',()=>{if(state.repeat==='one'){audio.currentTime=0;audio.play();}else nextSong()});
function updateFullControls(){let b=$('#bigPlay');if(b)b.textContent=audio.paused?'▶':'Ⅱ';let v=$('#vol');if(v)v.value=audio.volume}
function setMediaSession(s){
 if(!('mediaSession' in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||'Artiste inconnu',album:s.album||'MusicBox'});
 navigator.mediaSession.setActionHandler?.('play',()=>audio.play());
 navigator.mediaSession.setActionHandler?.('pause',()=>audio.pause());
 navigator.mediaSession.setActionHandler?.('previoustrack',prevSong);
 navigator.mediaSession.setActionHandler?.('nexttrack',nextSong);
 navigator.mediaSession.setActionHandler?.('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-10));
 navigator.mediaSession.setActionHandler?.('seekforward',()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10));
}

async function init(){
 await openDB();await loadState();renderNav();home();renderPlayer();
}
init().catch(e=>{console.error(e);$('#app').innerHTML='<div class="card"><h1>MusicBox</h1><p>Impossible d’initialiser le stockage local.</p></div>'});
</script>
</body>
</html>
